name: Deploy to Natro (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CSS/JS/görsel adreslerine commit kodunu ekle (?v=dev -> ?v=abc1234),
      # böylece Cloudflare ve tarayıcılar her yayında yeni dosyaları indirir
      - name: Cache busting
        run: find . -name "*.html" -not -path "./cv/*" -not -path "./.git/*" -exec sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" {} +

      # Önce CSS/JS/görsel/PDF yüklenir, HTML sayfaları en son. Aksi halde yükleme sürerken
      # gelen istek yeni ?v= adresiyle eski/yarım dosyayı Cloudflare'e 7 günlüğüne önbelleğe alır.
      # HTML'ler ayrı durum dosyasıyla hariç tutulur ki bu adım onları sunucudan silmesin.
      - name: FTP Deploy (dosyalar)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          state-name: .ftp-deploy-assets-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.md
            cv/**
            **/*.html

      - name: FTP Deploy (HTML sayfaları en son)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # Alt sayfalar önce, index.html en son; yeni klasörleri curl kendisi açar
        run: |
          find . -name "*.html" -not -path "./cv/*" -not -path "./.git/*" -not -path "./index.html" -print0 |
            while IFS= read -r -d '' f; do
              curl -sS --fail --ftp-create-dirs -T "$f" --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/public_html/${f#./}"
            done
          curl -sS --fail -T index.html --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/public_html/index.html"
