name: Deploy to Natro (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CSS/JS/görsel adreslerine commit kodunu ekle (?v=dev -> ?v=abc1234),
      # böylece Cloudflare ve tarayıcılar her yayında yeni dosyaları indirir
      - name: Cache busting
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.md
            cv/**
